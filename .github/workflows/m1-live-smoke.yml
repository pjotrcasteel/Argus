name: M1 public WyrmForge visual smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/m1-live-smoke.yml
      - examples/wyrmforge.profile.json
      - src/Argus.Agents.Visual/**
      - src/Argus.Runner/**
      - tests/Argus.Tests/**
      - tests/Argus.Annotation.UiSmoke/**
      - tools/m215/**
      - web/candidate-annotator/**
      - src/Argus.Replay/**
      - src/Argus.Evaluation/**
      - src/Argus.Study.Tool/**
      - src/Argus.Personas/**
      - src/Argus.Persona.Tool/**
permissions:
  contents: read
jobs:
  first-live-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install free OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Build ARGUS
        run: |
          dotnet restore Argus.slnx
          dotnet build Argus.slnx --configuration Release --no-restore
      - name: Install Chromium
        shell: pwsh
        run: ./src/Argus.Runner/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run bounded visual-agent smoke against public game
        run: |
          dotnet run --project src/Argus.Runner --configuration Release --no-build -- \
            --url https://pjotrcasteel.github.io/Wyrmforge/ \
            --agent visual \
            --profile examples/wyrmforge.profile.json \
            --headless --require-combat-vision --max-steps 56 --timeout-seconds 180 \
            --output artifacts/m1-live
      - name: Generate offline replay from actual WyrmForge trace
        run: |
          dotnet run --project src/Argus.Replay.Tool --configuration Release --no-build -- --run artifacts/m1-live
          test -s artifacts/m1-live/replay.html
      - name: Prepare offline human annotation template (all unknown)
        run: |
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/m1-live --template artifacts/m1-live/labels.template.json
          test -s artifacts/m1-live/labels.template.json
      - name: Render offline annotation UI from real saved screenshots
        run: |
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/m1-live --annotate artifacts/m1-live/annotate.html
          test -s artifacts/m1-live/annotate.html
      - name: Validate generated annotation JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('artifacts/m1-live/annotate.html').read_text()
          assert html.count('<script>') == 1
          javascript = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('artifacts/m1-live/annotate-script.js').write_text(javascript)
          PY
          node --check artifacts/m1-live/annotate-script.js
      - name: Verify annotation clicks and downloaded JSON in Chromium
        run: |
          dotnet run --project tests/Argus.Annotation.UiSmoke --configuration Release --no-build -- artifacts/m1-live
      - name: Generate blinded review page from a real public WyrmForge screenshot trace
        run: |
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/m1-live --blind-annotate artifacts/m1-live/blind-annotate.html
          test -s artifacts/m1-live/blind-annotate.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path("artifacts/m1-live/blind-annotate.html").read_text()
          assert "BLIND REVIEW" in html
          assert html.count("<script>") == 1
          assert html.count("</script>") == 1
          Path("artifacts/m1-live/blind-script.js").write_text(html.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check artifacts/m1-live/blind-script.js
      - name: Compare personality hypotheses against the exact same real visual frames (shadow only)
        run: |
          dotnet run --project src/Argus.Persona.Tool --configuration Release --no-build -- \
            --run artifacts/m1-live --movement-keys w,a,s,d --seed 42
          test -s artifacts/m1-live/persona-shadow.jsonl
          test -s artifacts/m1-live/persona-contrast.json
          test -s artifacts/m1-live/persona-contrast.md
          test -s artifacts/m1-live/persona-ablation.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows = [json.loads(line) for line in Path("artifacts/m1-live/persona-shadow.jsonl").read_text().splitlines()]
          assert len(rows) > 0
          assert len(rows[0]["candidates"]) == 3
          assert all(row["note"].startswith("SHADOW ONLY") for row in rows)
          report = json.loads(Path("artifacts/m1-live/persona-contrast.json").read_text())
          assert report["totalFrames"] == len(rows)
          assert 0 <= report["gameplayFramesWithCandidateLocationsUnknown"] <= report["gameplayFrames"]
          assert len(report["personas"]) == 3
          assert len(report["pairs"]) == 3
          ablations = json.loads(Path("artifacts/m1-live/persona-ablation.json").read_text())
          assert len(ablations["traits"]) == 5
          assert ablations["randomStreamKey"] == "controlled-ablation-v1"
          assert all(0 <= t["differentDirections"] <= t["bothMovingFrames"] for t in ablations["traits"])
          for pair in report["pairs"]:
              assert 0 <= pair["bothMovingFrames"] <= pair["bothProposedFrames"] <= len(rows)
              assert 0 <= pair["differentDirections"] <= pair["bothMovingFrames"]
              assert 0 <= pair["differentFullActions"] <= pair["bothProposedFrames"]
              if pair["bothMovingFrames"] == 0:
                  assert pair["directionDifferenceRate"] is None
              else:
                  assert abs(pair["directionDifferenceRate"] - pair["differentDirections"] / pair["bothMovingFrames"]) < 1e-8
          PY
      - name: Show visual evidence report
        if: always()
        run: |
          if [ -f artifacts/m1-live/summary.json ]; then cat artifacts/m1-live/summary.json; fi
      - name: Upload screenshot evidence and JSONL trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-m1-live-visual-evidence
          path: artifacts/m1-live/
          if-no-files-found: warn
          retention-days: 2
