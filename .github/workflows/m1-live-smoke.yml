name: M1 public WyrmForge visual smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/m1-live-smoke.yml
      - examples/wyrmforge.profile.json
      - src/Argus.Agents.Visual/**
      - src/Argus.Runner/**
      - tests/Argus.Tests/**
      - tests/Argus.Annotation.UiSmoke/**
      - src/Argus.Replay/**
      - src/Argus.Evaluation/**
permissions:
  contents: read
jobs:
  first-live-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install free OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Build ARGUS
        run: |
          dotnet restore Argus.slnx
          dotnet build Argus.slnx --configuration Release --no-restore
      - name: Install Chromium
        shell: pwsh
        run: ./src/Argus.Runner/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run bounded visual-agent smoke against public game
        run: |
          dotnet run --project src/Argus.Runner --configuration Release --no-build -- \
            --url https://pjotrcasteel.github.io/Wyrmforge/ \
            --agent visual \
            --profile examples/wyrmforge.profile.json \
            --headless --require-combat-vision --max-steps 56 --timeout-seconds 180 \
            --output artifacts/m1-live
      - name: Generate offline replay from actual WyrmForge trace
        run: |
          dotnet run --project src/Argus.Replay.Tool --configuration Release --no-build -- --run artifacts/m1-live
          test -s artifacts/m1-live/replay.html
      - name: Prepare offline human annotation template (all unknown)
        run: |
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/m1-live --template artifacts/m1-live/labels.template.json
          test -s artifacts/m1-live/labels.template.json
      - name: Render offline annotation UI from real saved screenshots
        run: |
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/m1-live --annotate artifacts/m1-live/annotate.html
          test -s artifacts/m1-live/annotate.html
      - name: Validate generated annotation JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('artifacts/m1-live/annotate.html').read_text()
          assert html.count('<script>') == 1
          javascript = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('artifacts/m1-live/annotate-script.js').write_text(javascript)
          PY
          node --check artifacts/m1-live/annotate-script.js
      - name: Verify annotation clicks and downloaded JSON in Chromium
        run: |
          dotnet run --project tests/Argus.Annotation.UiSmoke --configuration Release --no-build -- artifacts/m1-live
      - name: Show visual evidence report
        if: always()
        run: |
          if [ -f artifacts/m1-live/summary.json ]; then cat artifacts/m1-live/summary.json; fi
      - name: Upload screenshot evidence and JSONL trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-m1-live-visual-evidence
          path: artifacts/m1-live/
          if-no-files-found: warn
          retention-days: 2
