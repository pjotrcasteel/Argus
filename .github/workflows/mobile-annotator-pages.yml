name: ARGUS Mobile Annotator Website
on:
  pull_request:
    paths:
      - web/mobile-annotator/**
      - web/point-annotator/**
      - tools/m218/**
      - tests/m218/**
      - .github/workflows/mobile-annotator-pages.yml
  push:
    branches: [main]
    paths:
      - web/mobile-annotator/**
      - web/point-annotator/**
      - tools/m218/**
      - tests/m218/**
      - .github/workflows/mobile-annotator-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-annotator:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve short-lived original ARGUS M2.4 development screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12100334875/zip > original-real-game-evidence.zip
          unzip -t original-real-game-evidence.zip | tail -1
      - name: Retrieve explicitly owner-approved M2.6b development mobile screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12108479907/zip > development-approved-reviews.zip
          unzip -t development-approved-reviews.zip | tail -1
      - name: Retrieve explicitly approved M2.7 blind development pages and research provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12111642304/zip > m27-approved-mobile-pages.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12111452798/zip > m27-frozen-development-evidence.zip
          unzip -t m27-approved-mobile-pages.zip | tail -1
          unzip -t m27-frozen-development-evidence.zip | tail -1
      - name: Retrieve owner-approved M2.15 original F/G/H candidate-location review only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12129481661/zip > m215-approved-spatial-review.zip
          unzip -t m215-approved-spatial-review.zip | tail -1
      - name: Generate original run-02 annotation route unchanged
        run: |
          python3 web/mobile-annotator/build.py \
            --archive original-real-game-evidence.zip --destination _site
      - name: Add two newly approved blind development annotation routes
        run: |
          python3 web/mobile-annotator/publish_m26b.py \
            --archive development-approved-reviews.zip --destination _site
      - name: Append newly approved C/D/E screenshot routes without modifying previous reviewers
        run: |
          python3 web/mobile-annotator/publish_m27.py \
            --mobile-archive m27-approved-mobile-pages.zip \
            --research-archive m27-frozen-development-evidence.zip \
            --destination _site
      - name: Append owner-approved F/G/H candidate-location routes, preserving originals
        run: |
          python3 web/mobile-annotator/publish_m215.py \
            --archive m215-approved-spatial-review.zip --destination _site
      - name: Verify M2.18 artificial-only source and private-label admission tests
        run: |
          python3 -m unittest discover -s tests/m218 -p 'test_player_point_study.py' -v
      - name: Append original-image player-point review routes with ZERO new PNGs
        run: |
          python3 tools/m218/player_point_study.py build \
            --archive m215-approved-spatial-review.zip --site _site
      - name: Check real screenshots, blind ground truth, and page JavaScript
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("_site/annoteren/run-02")
          html = (root / "index.html").read_text()
          assert len(list(root.glob("frame-*.png"))) == 12
          assert html.count("<script>") == 1 and html.count("</script>") == 1
          assert "/*ARGUS_FRAMES*/" not in html and "/*ARGUS_LABELS*/" not in html
          assert "playerX" not in html and "threatLocations" not in html
          assert "run-01" not in html
          Path("mobile-script.js").write_text(html.split("<script>",1)[1].split("</script>",1)[0])
          manifest = json.loads(Path("_site/published-development-manifest.json").read_text())
          assert manifest["routes"] == [
            "annoteren/run-02/", "annoteren/dev-a/", "annoteren/dev-b/",
            "annoteren/dev-c/", "annoteren/dev-d/", "annoteren/dev-e/",
            "annoteren/dev-f/", "annoteren/dev-g/", "annoteren/dev-h/"]
          assert manifest["m27StudySeed"] == "argus-m27-independent-development-frozen-20261017"
          assert manifest["m27ReviewConsent"] == "explicitly owner-approved 2026-10-17"
          assert len(manifest["preservedRun02HtmlSha256"]) == 64
          for name in ("dev-a", "dev-b", "dev-c", "dev-d", "dev-e"):
            directory = Path("_site/annoteren") / name
            doc = (directory / "index.html").read_text()
            assert len(list(directory.glob("frame-*.png"))) == 12
            assert len(manifest["screenshots"][name]) == 12
            assert "/*ARGUS_FRAMES*/" not in doc and "/*ARGUS_LABELS*/" not in doc
            assert "threatLocations" not in doc and "playerX" not in doc
            assert "run-01" not in doc and "run-02" not in doc
            Path(f"{name}-mobile-script.js").write_text(
              doc.split("<script>",1)[1].split("</script>",1)[0])
          assert len(list(Path("_site/annoteren").glob("*/frame-*.png"))) == 108
          assert len(manifest["screenshots"]) == 8
          for name in ("dev-c", "dev-d", "dev-e"):
            assert len(manifest["screenshots"][name]) == 12
          assert manifest["m215StudySeed"] == "argus-m215-independent-spatial-probes-20261018-v1"
          assert "standing consent" in manifest["m215ReviewConsent"]
          assert manifest["m215CandidatesPerRun"] == 24
          for name in ("dev-f", "dev-g", "dev-h"):
            folder = Path("_site/annoteren") / name
            html = (folder / "index.html").read_text()
            assert len(list(folder.glob("frame-*.png"))) == 12
            assert len(manifest["screenshots"][name]) == 12
            assert html.count("<script>") == 1 and html.count("</script>") == 1
            assert "playerX" not in html and "threatLocations" not in html and "run-01" not in html
            assert all(image.name in manifest["screenshots"][name] for image in folder.glob("frame-*.png"))
            Path(f"{name}-spatial-script.js").write_text(
              html.split("<script>",1)[1].split("</script>",1)[0])
          assert manifest["m218PointRoutes"] == [f"annoteren/dev-{run}-points/" for run in "fgh"]
          assert manifest["m218SourceStudySeed"] == "argus-m215-independent-spatial-probes-20261018-v1"
          for suffix in "fgh":
            folder = Path("_site/annoteren/dev-" + suffix + "-points")
            doc = (folder / "index.html").read_text()
            assert "/*ARGUS_POINT_STUDY*/" not in doc and "run-01" not in doc
            assert "localStorage.setItem(storageKey" in doc and "fetch(" not in doc
            assert len(list(folder.glob("*.png"))) == 0
            Path(f"dev-{suffix}-point-script.js").write_text(
              doc.split("<script>",1)[1].split("</script>",1)[0])
          print("Verified NINE preserved original routes + THREE BLIND pixel-point reviewer routes, 108 original PNGs.")

          PY
          node --check mobile-script.js
          node --check dev-a-mobile-script.js
          node --check dev-b-mobile-script.js
          node --check dev-c-mobile-script.js
          node --check dev-d-mobile-script.js
          node --check dev-e-mobile-script.js
          node --check dev-f-spatial-script.js
          node --check dev-g-spatial-script.js
          node --check dev-h-spatial-script.js
          node --check dev-f-point-script.js
          node --check dev-g-point-script.js
          node --check dev-h-point-script.js
      - name: Verify navigation, tap annotations and JSON download in mobile Chromium
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 -m playwright install --with-deps chromium
          python3 web/mobile-annotator/smoke.py --site _site
          python3 tools/m26b/smoke.py --site _site --runs dev-a dev-b dev-c dev-d dev-e
          python3 tools/m215/smoke.py --site _site
          python3 tests/m218/mobile_smoke.py --site _site
      - name: Upload build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: argus-mobile-pages-build
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-annotator
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download validated website build
        uses: actions/download-artifact@v4
        with:
          name: argus-mobile-pages-build
          path: _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish working HTTPS site
        id: deploy
        uses: actions/deploy-pages@v4
