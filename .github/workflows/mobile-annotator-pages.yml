name: ARGUS Mobile Annotator Website
on:
  pull_request:
    paths:
      - web/mobile-annotator/**
      - web/point-annotator/**
      - tools/m218/**
      - tools/m219/**
      - tools/m221/**
      - tools/m224/**
      - tools/m228/**
      - tests/m218/**
      - tests/m223/**
      - tests/m220/**
      - tests/m227/**
      - tests/m228/**
      - .github/workflows/mobile-annotator-pages.yml
  push:
    branches: [main]
    paths:
      - web/mobile-annotator/**
      - web/point-annotator/**
      - tools/m218/**
      - tools/m221/**
      - tools/m224/**
      - tools/m228/**
      - tests/m218/**
      - tests/m223/**
      - tests/m220/**
      - tests/m227/**
      - tests/m228/**
      - .github/workflows/mobile-annotator-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-annotator:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve immutable byte-verified 294-file development-only Git checkpoint and validate every source byte
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            refs/heads/public-annotator-site-m227-development:refs/remotes/origin/public-annotator-site-m227-development
          mkdir -p _site
          git archive refs/remotes/origin/public-annotator-site-m227-development | tar -xf - -C _site
          python3 tools/m228/consented_public_rst.py verify --site _site
      - name: Prove forbidden local owner exports and hidden material cannot enter this build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("_site")
          assert len(list(root.glob("annoteren/*/frame-*.png"))) == 270
          assert len(list(root.glob("annoteren/*/index.html"))) == 21
          assert len(list(root.glob("**/*.json"))) == 1
          assert not list(root.glob("**/*.jsonl"))
          assert not list(root.glob("**/*weights*"))
          assert not list(root.glob("annoteren/run-01/*"))
          assert not list(root.glob("annoteren/dev-o/*"))
          assert not list(root.glob("annoteren/dev-p/*"))
          assert not list(root.glob("annoteren/dev-q/*"))
          assert not list(root.rglob("context"))
          assert not list(root.rglob("prev-for-*.png"))
          print("PASS: site has zero owner JSON, model, trace or held-out game files.")
          PY
      - name: Check real screenshots, blind ground truth, and page JavaScript
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("_site/annoteren/run-02")
          html = (root / "index.html").read_text()
          assert len(list(root.glob("frame-*.png"))) == 12
          assert html.count("<script>") == 1 and html.count("</script>") == 1
          assert "/*ARGUS_FRAMES*/" not in html and "/*ARGUS_LABELS*/" not in html
          assert "playerX" not in html and "threatLocations" not in html
          assert "run-01" not in html
          Path("mobile-script.js").write_text(html.split("<script>",1)[1].split("</script>",1)[0])
          manifest = json.loads(Path("_site/published-development-manifest.json").read_text())
          assert manifest["routes"] == [
            "annoteren/run-02/", "annoteren/dev-a/", "annoteren/dev-b/",
            "annoteren/dev-c/", "annoteren/dev-d/", "annoteren/dev-e/",
            "annoteren/dev-f/", "annoteren/dev-g/", "annoteren/dev-h/"]
          assert manifest["m27StudySeed"] == "argus-m27-independent-development-frozen-20261017"
          assert manifest["m27ReviewConsent"] == "explicitly owner-approved 2026-10-17"
          assert len(manifest["preservedRun02HtmlSha256"]) == 64
          for name in ("dev-a", "dev-b", "dev-c", "dev-d", "dev-e"):
            directory = Path("_site/annoteren") / name
            doc = (directory / "index.html").read_text()
            assert len(list(directory.glob("frame-*.png"))) == 12
            assert len(manifest["screenshots"][name]) == 12
            assert "/*ARGUS_FRAMES*/" not in doc and "/*ARGUS_LABELS*/" not in doc
            assert "threatLocations" not in doc and "playerX" not in doc
            assert "run-01" not in doc and "run-02" not in doc
            Path(f"{name}-mobile-script.js").write_text(
              doc.split("<script>",1)[1].split("</script>",1)[0])
          assert len(list(Path("_site/annoteren").glob("*/frame-*.png"))) == 270
          assert len(manifest["screenshots"]) == 8
          for name in ("dev-c", "dev-d", "dev-e"):
            assert len(manifest["screenshots"][name]) == 12
          assert manifest["m215StudySeed"] == "argus-m215-independent-spatial-probes-20261018-v1"
          assert "standing consent" in manifest["m215ReviewConsent"]
          assert manifest["m215CandidatesPerRun"] == 24
          for name in ("dev-f", "dev-g", "dev-h"):
            folder = Path("_site/annoteren") / name
            html = (folder / "index.html").read_text()
            assert len(list(folder.glob("frame-*.png"))) == 12
            assert len(manifest["screenshots"][name]) == 12
            assert html.count("<script>") == 1 and html.count("</script>") == 1
            assert "playerX" not in html and "threatLocations" not in html and "run-01" not in html
            assert all(image.name in manifest["screenshots"][name] for image in folder.glob("frame-*.png"))
            Path(f"{name}-spatial-script.js").write_text(
              html.split("<script>",1)[1].split("</script>",1)[0])
          assert manifest["m218PointRoutes"] == [f"annoteren/dev-{run}-points/" for run in "fgh"]
          assert manifest["m218SourceStudySeed"] == "argus-m215-independent-spatial-probes-20261018-v1"
          for suffix in "fgh":
            folder = Path("_site/annoteren/dev-" + suffix + "-points")
            doc = (folder / "index.html").read_text()
            assert "/*ARGUS_POINT_STUDY*/" not in doc and "run-01" not in doc
            assert "localStorage.setItem(storageKey" in doc and "fetch(" not in doc
            assert len(list(folder.glob("*.png"))) == 0
            Path(f"dev-{suffix}-point-script.js").write_text(
              doc.split("<script>",1)[1].split("</script>",1)[0])
          assert manifest["m220PointRoutes"] == [f"annoteren/dev-{run}/" for run in "ijk"]
          assert manifest["m220SourceStudySeed"] == "argus-m220-independent-blind-player-point-20261018-v1"
          assert manifest["m220HumanTruth"] == "ALL_UNKNOWN"
          for run in "ijk":
            name = "dev-" + run
            folder = Path("_site/annoteren") / name
            doc = (folder / "index.html").read_text()
            assert len(list(folder.glob("frame-*.png"))) == 18
            assert len(manifest["m220Screenshots"][name]) == 18
            assert '"state":"visible"' not in doc and "fetch(" not in doc
            assert "localStorage.setItem(storageKey" in doc and "run-01" not in doc
            Path(f"{name}-m220-public-script.js").write_text(
              doc.split("<script>",1)[1].split("</script>",1)[0])
          assert manifest["m223PointRoutes"] == [f"annoteren/dev-{run}/" for run in "lmn"]
          assert manifest["m223SourceStudySeed"] == "argus-m223-fresh-development-20261018-v1"
          assert manifest["m223HumanTruth"] == "ALL_UNKNOWN"
          for suffix in "lmn":
            name = "dev-" + suffix
            folder = Path("_site/annoteren") / name
            doc = (folder / "index.html").read_text()
            assert len(list(folder.glob("frame-*.png"))) == 18
            assert len(manifest["m223Screenshots"][name]) == 18
            assert '"state":"visible"' not in doc and "fetch(" not in doc
            assert "localStorage.setItem(storageKey" in doc and "run-01" not in doc
            Path(f"{name}-m223-public-script.js").write_text(
              doc.split("<script>",1)[1].split("</script>",1)[0])
          assert not Path("_site/annoteren/dev-o").exists()
          assert not Path("_site/annoteren/dev-p").exists()
          assert not Path("_site/annoteren/dev-q").exists()
          assert manifest["m227SourceStudySeed"] == "argus-m227-temporal-context-rst-20261018-v1"
          assert manifest["m227PointRoutes"] == [f"annoteren/dev-{run}/" for run in "rst"]
          assert manifest["m227HumanTruth"] == "ALL_UNKNOWN"
          for suffix in "rst":
            name = "dev-" + suffix
            folder = Path("_site/annoteren") / name
            doc = (folder / "index.html").read_text()
            assert len(list(folder.glob("frame-*.png"))) == 18
            assert len(manifest["m227Screenshots"][name]) == 18
            assert '"state":"visible"' not in doc and "fetch(" not in doc
            assert "localStorage.setItem(storageKey" in doc and "run-01" not in doc
            Path(f"{name}-m227-public-script.js").write_text(
              doc.split("<script>",1)[1].split("</script>",1)[0])
          print("Verified 18 old + 3 new UNKNOWN reviewers, 270 authentic images; no private contexts/prospectives.")

          PY
          node --check mobile-script.js
          node --check dev-a-mobile-script.js
          node --check dev-b-mobile-script.js
          node --check dev-c-mobile-script.js
          node --check dev-d-mobile-script.js
          node --check dev-e-mobile-script.js
          node --check dev-f-spatial-script.js
          node --check dev-g-spatial-script.js
          node --check dev-h-spatial-script.js
          node --check dev-f-point-script.js
          node --check dev-g-point-script.js
          node --check dev-h-point-script.js
          node --check dev-i-m220-public-script.js
          node --check dev-j-m220-public-script.js
          node --check dev-k-m220-public-script.js
          node --check dev-l-m223-public-script.js
          node --check dev-m-m223-public-script.js
          node --check dev-n-m223-public-script.js
          node --check dev-r-m227-public-script.js
          node --check dev-s-m227-public-script.js
          node --check dev-t-m227-public-script.js
      - name: Verify navigation, tap annotations and JSON download in mobile Chromium
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 -m playwright install --with-deps chromium
          python3 web/mobile-annotator/smoke.py --site _site
          python3 tools/m26b/smoke.py --site _site --runs dev-a dev-b dev-c dev-d dev-e
          python3 tools/m215/smoke.py --site _site
          python3 tests/m218/mobile_smoke.py --site _site
          python3 tests/m220/mobile_smoke.py --site _site
          python3 tests/m223/mobile_smoke.py --site _site
          python3 tests/m227/mobile_smoke.py --site _site
      - name: Upload build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: argus-mobile-pages-build
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-annotator
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download validated website build
        uses: actions/download-artifact@v4
        with:
          name: argus-mobile-pages-build
          path: _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish working HTTPS site
        id: deploy
        uses: actions/deploy-pages@v4
