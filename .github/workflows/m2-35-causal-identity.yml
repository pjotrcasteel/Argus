name: M2.35 causal visual identity hypotheses (synthetic only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/m235/**'
      - 'tests/m235/**'
      - '.github/workflows/m2-35-causal-identity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/m235/**'
      - 'tests/m235/**'
      - '.github/workflows/m2-35-causal-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-source-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free and fully offline local image dependencies
        run: python -m pip install 'numpy>=2,<3' 'Pillow>=11,<13'
      - name: Execute artificial original-size RGB temporal and lookalike tests
        env:
          PYTHONPATH: .
          OPENBLAS_NUM_THREADS: 1
        run: python -m unittest discover -s tests/m235 -p 'test_*.py' -v
      - name: Reject real human references, private source screenshots, model weights and held-outs
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for root in (Path('tools/m235'),Path('tests/m235')):
              assert not [p for p in root.rglob('*') if p.suffix in
                          ('.json','.jsonl','.png','.zip','.jpg','.pkl','.pt','.onnx')]
          code=Path('tools/m235/causal_identity.py').read_text()
          ast.parse(code)
          assert 'verifiedPlayerCenter":None' in code and '"playerPresent":None' in code
          assert 'MAX_CANDIDATES = 12' in code
          assert 'REQUIRED_CONSECUTIVE_FRAMES = 3' in code
          assert 'MIN_SCREEN_PIXEL_CHANGE = .012' in code
          print('PASS: synthetic only; no confident player identity or original owner pixels in CI.')
          PY
