name: CI - free build and deterministic tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Argus.slnx
      - name: Build
        run: dotnet build Argus.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/Argus.Tests/Argus.Tests.csproj --configuration Release --no-build --logger trx
      - name: Verify reproducible offline study CLI with generated fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          base = Path("artifacts/ci-study")
          for name in ("independent-a", "independent-b"):
              folder = base / name
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "frame-0000.png").write_bytes(bytes([137,80,78,71,13,10,26,10]) + bytes(12))
              record = {
                  "step": 0, "timestampUtc": "2026-10-17T10:00:00Z",
                  "width": 390, "height": 844, "screenshot": "frame-0000.png",
                  "evidence": {
                      "phase": "exploring", "reason": "fixture " + name,
                      "combat": {"playerX": 195, "playerY": 420, "threatCandidates": 0, "threatLocations": []}
                  }
              }
              (folder / "trace.jsonl").write_text(json.dumps(record) + "\n")
          PY
          dotnet run --project src/Argus.Study.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-study --seed fixture-stable-seed --samples 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/ci-study")
          plan = json.loads((root / "study-plan.json").read_text())
          assert len(plan["assignments"]) == 2
          assert sorted(a["partition"] for a in plan["assignments"]) == ["development", "held-out"]
          for assignment in plan["assignments"]:
              folder = root / assignment["runId"]
              html = (folder / "blind-annotate.html").read_text()
              labels = json.loads((folder / "blind-labels.template.json").read_text())
              assert "BLIND REVIEW" in html
              assert "\"playerX\":195" not in html
              assert "fixture " + assignment["runId"] not in html
              assert labels["frames"][0]["player"]["state"] == "unknown"
              assert labels["frames"][0]["threats"]["state"] == "unknown"
          PY
      - name: Verify persona cohort CLI and attribution on two offline fixture runs
        run: |
          dotnet run --project src/Argus.Persona.Cohort.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-study --movement-keys w,a,s,d --seed 42
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/ci-study")
          report = json.loads((root / "persona-cohort.json").read_text())
          markdown = (root / "persona-cohort.md").read_text()
          assert report["runCount"] == 2
          assert report["matchedContext"] is False
          assert [r["runId"] for r in report["runs"]] == ["independent-a", "independent-b"]
          assert len(report["pairs"]) == 3
          assert len(report["traits"]) == 5
          assert all(p["directionDifferences"]["totalRuns"] == 2 for p in report["pairs"])
          assert "DESCRIPTIVE, SHADOW ONLY" in markdown
          assert "riskAppetite" in markdown
          PY
      - name: Confirm synthetic blind studies without human labels are NOT_EVALUATED
        run: |
          dotnet run --project src/Argus.Study.Quality.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-study
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/ci-study/study-quality.json").read_text())
          assert report["status"] == "NOT_EVALUATED"
          assert len(report["runs"]) == 2
          assert all(r["status"] == "NOT_EVALUATED" and r["perception"] is None for r in report["runs"])
          assert sorted(p["partition"] for p in report["partitions"]) == ["development","held-out"]
          assert all(p["playerPrecision"]["median"] is None for p in report["partitions"])
          assert "NOT_EVALUATED" in Path("artifacts/ci-study/study-quality.md").read_text()
          PY

      - name: Verify shadow edge CLI end-to-end using entirely synthetic PNG/labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, zlib
          width, height = 390, 844
          root = Path("artifacts/ci-shadow/run-local")
          root.mkdir(parents=True, exist_ok=True)
          rgb = bytearray(bytes([30, 39, 34]) * width * height)
          def paint(x, y, w, h, color):
              for row in range(y, y + h):
                  for col in range(x, x + w):
                      i = (row * width + col) * 3
                      rgb[i:i + 3] = bytes(color)
          paint(180, 405, 20, 30, (72, 91, 115))
          paint(120, 400, 20, 28, (120, 84, 66))
          paint(300, 110, 20, 25, (120, 84, 66))
          paint(372, 385, 18, 27, (120, 84, 66))
          def chunk(kind, contents):
              return struct.pack(">I", len(contents)) + kind + contents + struct.pack(">I", zlib.crc32(kind + contents) & 0xffffffff)
          rows = b"".join(b"\x00" + rgb[y * width * 3:(y + 1) * width * 3] for y in range(height))
          image = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
          image += chunk(b"IDAT", zlib.compress(rows, 9)) + chunk(b"IEND", b"")
          (root / "frame-0000.png").write_bytes(image)
          # Subsequent image: one moving supplemental candidate + one stationary decoration.
          paint(300, 110, 20, 25, (30, 39, 34))
          paint(305, 110, 20, 25, (120, 84, 66))
          rows = b"".join(b"\x00" + rgb[y * width * 3:(y + 1) * width * 3] for y in range(height))
          image = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
          image += chunk(b"IDAT", zlib.compress(rows, 9)) + chunk(b"IEND", b"")
          (root / "frame-0001.png").write_bytes(image)
          record = {"step": 0, "timestampUtc": "2026-10-17T10:00:00Z",
                    "width": width, "height": height, "screenshot": "frame-0000.png",
                    "evidence": {"phase": "exploring", "reason": "synthetic only"}}
          next_record = {"step": 1, "timestampUtc": "2026-10-17T10:00:01Z",
                    "width": width, "height": height, "screenshot": "frame-0001.png",
                    "evidence": {"phase": "exploring", "reason": "synthetic only"}}
          (root / "trace.jsonl").write_text(json.dumps(record) + "\n" + json.dumps(next_record) + "\n")
          point = lambda x, y: {"x": x, "y": y}
          labels = {"schemaVersion": 1, "runId": "run-local",
                    "frames": [{"step": 0, "player": {"state": "visible", "center": point(189, 420)},
                                "threats": {"state": "known", "centers": [point(130, 413), point(310, 122), point(380, 398)]}}]}
          (root / "labels.json").write_text(json.dumps(labels))
          PY
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-shadow/run-local --shadow-edges examples/wyrmforge.profile.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path("artifacts/ci-shadow/run-local/shadow-edge-study.json").read_text())
          assert report["scoredFrames"] == 1
          assert report["baseline"]["truePositive"] == 1
          assert report["expanded"]["truePositive"] == 3
          assert report["baseline"]["falseNegative"] == 2
          assert report["expanded"]["falseNegative"] == 0
          assert len(report["frames"][0]["additionalCandidates"]) == 2
          assert "temporal" in Path("artifacts/ci-shadow/run-local/shadow-edge-study.md").read_text()
          PY

      - name: Verify temporal shadow report only accepts moving sequential candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/ci-shadow/run-local")
          point = lambda x, y: {"x": x, "y": y}
          (root / "labels.json").write_text(json.dumps({
              "schemaVersion": 1, "runId": "run-local",
              "frames": [{"step": 1, "player": {"state": "visible", "center": point(189, 420)},
                          "threats": {"state": "known", "centers": [point(130, 413), point(315, 122)]}}]
          }))
          PY
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-shadow/run-local --shadow-edges examples/wyrmforge.profile.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          result = json.loads(Path("artifacts/ci-shadow/run-local/shadow-edge-study.json").read_text())
          assert result["scoredFrames"] == 1
          assert (result["baseline"]["truePositive"], result["baseline"]["falsePositive"], result["baseline"]["falseNegative"]) == (1, 0, 1)
          assert (result["expanded"]["truePositive"], result["expanded"]["falsePositive"], result["expanded"]["falseNegative"]) == (2, 1, 0)
          assert (result["temporal"]["truePositive"], result["temporal"]["falsePositive"], result["temporal"]["falseNegative"]) == (2, 0, 0)
          item = result["frames"][0]
          assert item["temporallyConfirmed"] == 1
          assert item["stationary"] == 1
          assert item["pending"] == 0
          PY

      - name: Verify stationary candidate audit exposes both recovery and decoration risks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          folder = Path("artifacts/ci-shadow/run-local")
          shutil.copyfile(folder / "frame-0001.png", folder / "frame-0002.png")
          record = {"step": 2, "timestampUtc": "2026-10-17T10:00:02Z",
                    "width": 390, "height": 844, "screenshot": "frame-0002.png",
                    "evidence": {"phase": "exploring", "reason": "synthetic still test"}}
          with (folder / "trace.jsonl").open("a") as file:
              file.write(json.dumps(record) + "\n")
          point = lambda x, y: {"x": x, "y": y}
          labels = {"schemaVersion": 1, "runId": "run-local",
                    "frames": [{"step": 2, "player": {"state": "visible", "center": point(189, 420)},
                                "threats": {"state": "known",
                                            "centers": [point(130, 413), point(315, 122), point(380, 398)]}}]}
          (folder / "labels.json").write_text(json.dumps(labels))
          PY
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-shadow/run-local --shadow-edges examples/wyrmforge.profile.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path("artifacts/ci-shadow/run-local/shadow-edge-study.json")
          report = json.loads(p.read_text())
          assert report["scoredFrames"] == 1
          assert (report["temporal"]["truePositive"], report["temporal"]["falseNegative"]) == (2, 1)
          assert (report["persistentStationaryTrial"]["truePositive"],
                  report["persistentStationaryTrial"]["falsePositive"],
                  report["persistentStationaryTrial"]["falseNegative"]) == (3, 0, 0)
          assert report["frames"][0]["persistentStationaryProposals"] == 1
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          folder = Path("artifacts/ci-shadow/run-local")
          p = folder / "labels.json"
          label = json.loads(p.read_text())
          label["frames"][0]["threats"]["centers"].pop()
          p.write_text(json.dumps(label))
          PY
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-shadow/run-local --shadow-edges examples/wyrmforge.profile.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path("artifacts/ci-shadow/run-local/shadow-edge-study.json").read_text())
          assert (report["temporal"]["truePositive"], report["temporal"]["falsePositive"]) == (2, 0)
          assert (report["persistentStationaryTrial"]["truePositive"],
                  report["persistentStationaryTrial"]["falsePositive"]) == (2, 1)
          assert "Experimental: temporal + persistent still" in Path(
              "artifacts/ci-shadow/run-local/shadow-edge-study.md").read_text()
          PY

      - name: Verify image appearance audit end-to-end on existing synthetic reviewed PNG
        run: |
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-shadow/run-local --appearance-audit examples/wyrmforge.profile.json
          python3 - <<'PY'
          from pathlib import Path
          import json, math
          root = Path("artifacts/ci-shadow/run-local")
          report = json.loads((root / "appearance-audit.json").read_text())
          assert report["scoredFrames"] == 1
          assert report["labeledFrames"] == 1
          assert report["missedHumanCenters"] == 0
          assert len(report["candidates"]) == 3
          assert sum(row["matchedHuman"] for row in report["candidates"]) == 2
          assert sum(not row["matchedHuman"] for row in report["candidates"]) == 1
          assert {group["source"] for group in report["groups"]} == {"baseline", "shadow"}
          assert all(0 <= v <= 1 and math.isfinite(v)
              for c in report["candidates"]
              for v in (c["features"]["meanLuminance"], c["features"]["luminanceStdDev"],
                        c["features"]["contrastToSurroundings"], c["features"]["gradientDensity"],
                        c["features"]["meanSaturation"]))
          assert "No model was trained" in (root / "appearance-audit.md").read_text()
          PY

      - name: Verify distinct development-only sampling and mobile package using synthetic traces
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          src = Path("artifacts/ci-shadow/run-local")
          dst = Path("artifacts/ci-dev")
          for name in ("dev-a", "dev-b"):
              folder = dst / name
              folder.mkdir(parents=True, exist_ok=True)
              for png in src.glob("frame-*.png"):
                  shutil.copyfile(png, folder / png.name)
              records = [json.loads(line) for line in (src / "trace.jsonl").read_text().splitlines()]
              for record in records:
                  record["evidence"]["reason"] = "independent synthetic " + name
              (folder / "trace.jsonl").write_text("\n".join(json.dumps(record) for record in records) + "\n")
          PY
          dotnet run --project src/Argus.Study.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-dev --seed m26-ci-frozen-sample --samples 3 --development-only
          dotnet run --project src/Argus.Study.Quality.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-dev
          python3 tools/m26b/mobile_review.py --runs artifacts/ci-dev --output artifacts/ci-mobile
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/ci-dev")
          plan = json.loads((root / "study-plan.json").read_text())
          report = json.loads((root / "study-quality.json").read_text())
          assert plan["mode"] == "development-only"
          assert all(a["partition"] == "development" and len(a["frameSteps"]) == 3
                     for a in plan["assignments"])
          assert report["status"] == "NOT_EVALUATED"
          assert report["partitions"][0]["runs"] == 2
          assert report["partitions"][1]["runs"] == 0
          for name in ("dev-a", "dev-b"):
              run = root / name
              page = Path("artifacts/ci-mobile/annoteren") / name / "index.html"
              html = page.read_text()
              labels = json.loads((run / "blind-labels.template.json").read_text())
              assert all(f["player"]["state"] == "unknown" and f["threats"]["state"] == "unknown"
                         for f in labels["frames"])
              assert "3 echte screenshots" in html
              assert len(list(page.parent.glob("frame-*.png"))) == 3
              assert "threatLocations" not in html and "playerX" not in html
              assert "run-01" not in html and "run-02" not in html
              script = html.split("<script>", 1)[1].split("</script>", 1)[0]
              Path("artifacts/ci-mobile/" + name + ".js").write_text(script)
          PY
          node --check artifacts/ci-mobile/dev-a.js
          node --check artifacts/ci-mobile/dev-b.js

      - name: Verify causal edge-player appearance audit on synthetic PNG sequences
        run: |
          python3 tools/m26d/generate_causal_fixture.py
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-causal-appearance/run-local --appearance-audit examples/wyrmforge.profile.json
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-causal-appearance/run-local --shadow-edges examples/wyrmforge.profile.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/ci-causal-appearance/run-local")
          appearance = json.loads((root / "appearance-audit.json").read_text())
          shadow = json.loads((root / "shadow-edge-study.json").read_text())
          assert appearance["labeledFrames"] == 1
          assert appearance["scoredFrames"] == 1
          assert appearance["frames"][0]["status"] == "SCORED"
          assert appearance["frames"][0]["matchedCandidates"] == 1
          assert appearance["frames"][0]["missedHumanCenters"] == 0
          assert len(appearance["candidates"]) == 1
          assert appearance["candidates"][0]["matchedHuman"]
          assert shadow["scoredFrames"] == 1
          assert shadow["baseline"]["truePositive"] == 1
          assert shadow["baseline"]["falseNegative"] == 0
          assert "Causal player tracking" in (root / "appearance-audit.md").read_text()
          PY

      - name: Verify offline classifier readiness gate on synthetic development-only reviews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/ci-dev")
          plan = json.loads((root / "study-plan.json").read_text())
          assert plan["mode"] == "development-only"
          for assignment in plan["assignments"]:
              assert assignment["partition"] == "development"
              folder = root / assignment["runId"]
              point = lambda x, y: {"x": x, "y": y}
              labels = {
                  "schemaVersion": 1, "runId": assignment["runId"],
                  "frames": [{
                      "step": index,
                      "player": {"state": "visible", "center": point(189, 420)},
                      "threats": {"state": "known", "centers": [point(130, 413)]}
                  } for index in assignment["frameSteps"]]
              }
              (folder / "labels.json").write_text(json.dumps(labels))
          PY
          for run in dev-a dev-b; do
            dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
              --run "artifacts/ci-dev/$run" --appearance-audit examples/wyrmforge.profile.json
          done
          dotnet run --project src/Argus.Study.Quality.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-dev --appearance-readiness
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/ci-dev")
          report = json.loads((root / "appearance-readiness.json").read_text())
          assert report["status"] == "NOT_READY", report
          assert report["developmentRuns"] == 2
          assert len(report["runs"]) == 2
          assert any("distinct development runs" in blocker for blocker in report["blockers"])
          assert all(row["scoredFrames"] == 3 for row in report["runs"])
          assert all(row["enoughReferences"] is False for row in report["runs"])
          assert "confirmed enemy/non-enemy identities" in (root / "appearance-readiness.md").read_text()
          PY

      - name: Verify new 3-run blind development study and mobile preview integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          source = Path("artifacts/ci-shadow/run-local")
          destination = Path("artifacts/ci-m27")
          original = [json.loads(line) for line in (source / "trace.jsonl").read_text().splitlines()]
          for name in ("dev-c", "dev-d", "dev-e"):
              folder = destination / name
              folder.mkdir(parents=True, exist_ok=True)
              for image in source.glob("frame-*.png"):
                  shutil.copyfile(image, folder / image.name)
              trace = [dict(row, evidence=dict(row["evidence"], reason="m27 synthetic " + name))
                       for row in original]
              (folder / "trace.jsonl").write_text("\n".join(json.dumps(row) for row in trace) + "\n")
          PY
          dotnet run --project src/Argus.Study.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-m27 --seed argus-m27-independent-development-frozen-20261017 \
            --samples 3 --development-only
          dotnet run --project src/Argus.Study.Quality.Tool --configuration Release --no-build -- \
            --runs artifacts/ci-m27
          python3 tools/m26b/mobile_review.py --runs artifacts/ci-m27 --output artifacts/ci-m27-mobile
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          root = Path("artifacts/ci-m27")
          plan = json.loads((root / "study-plan.json").read_text())
          report = json.loads((root / "study-quality.json").read_text())
          assert plan["mode"] == "development-only"
          assert sorted(a["runId"] for a in plan["assignments"]) == ["dev-c","dev-d","dev-e"]
          assert all(a["partition"] == "development" and len(a["frameSteps"]) == 3 for a in plan["assignments"])
          assert report["status"] == "NOT_EVALUATED"
          assert report["partitions"][0]["runs"] == 3
          assert report["partitions"][1]["runs"] == 0
          traces = set()
          for name in ("dev-c","dev-d","dev-e"):
              traces.add(hashlib.sha256((root / name / "trace.jsonl").read_bytes()).hexdigest())
              template = json.loads((root / name / "blind-labels.template.json").read_text())
              assert all(x["player"]["state"] == "unknown" and x["threats"]["state"] == "unknown"
                         for x in template["frames"])
              folder = Path("artifacts/ci-m27-mobile/annoteren") / name
              assert len(list(folder.glob("frame-*.png"))) == 3
              html = (folder / "index.html").read_text()
              assert "3 echte screenshots" in html
              assert "threatLocations" not in html and "playerX" not in html
              assert "run-01" not in html and "run-02" not in html
              Path("artifacts/ci-m27-mobile/" + name + ".js").write_text(
                  html.split("<script>", 1)[1].split("</script>", 1)[0])
          assert len(traces) == 3
          PY
          node --check artifacts/ci-m27-mobile/dev-c.js
          node --check artifacts/ci-m27-mobile/dev-d.js
          node --check artifacts/ci-m27-mobile/dev-e.js

      - name: Verify pixel-only player loss diagnostic in full offline CLI with fake reference screenshots
        run: |
          python3 tools/m29/generate_player_loss_fixture.py
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-player-loss/run-local --player-visibility examples/wyrmforge.profile.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          folder = Path("artifacts/ci-player-loss/run-local")
          output = json.loads((folder / "player-visibility-audit.json").read_text())
          assert output["reviewedFrames"] == 5
          assert output["comparablePlayerFrames"] == 4
          assert output["recordedPlayerFrames"] == 2
          assert output["missingRecordedPlayerFrames"] == 2
          assert output["nonCombatVisiblePlayerFrames"] == 1
          rows = {f["step"]: f for f in output["frames"]}
          assert rows[0]["status"] == "NOT_COMBAT_PHASE"
          assert rows[1]["status"] == "RECORDED_PLAYER"
          assert rows[2]["status"] == "PLAYER_NOT_RECORDED"
          assert rows[2]["pixelComponentStatus"] == "TOO_WIDE"
          assert rows[2]["nearestComponent"]["width"] == 60
          assert rows[3]["status"] == "PLAYER_NOT_RECORDED"
          assert rows[3]["pixelComponentStatus"] == "BELOW_MINIMUM_PIXELS"
          assert rows[3]["nearestComponent"]["matchingPixels"] == 63
          assert rows[4]["status"] == "RECORDED_PLAYER"
          report = (folder / "player-visibility-audit.md").read_text()
          assert "TOO_WIDE" in report and "BELOW_MINIMUM_PIXELS" in report
          print("PASS: player-loss cause evidence, transition exclusion and original scorer untouched.")
          PY

      - name: Verify shadow-only occlusion confidence and explicit false bridge traps using synthetic PNGs
        run: |
          python3 tools/m210/generate_occlusion_shadow_fixture.py
          dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
            --run artifacts/ci-occlusion-shadow/run-local --occlusion-shadow examples/wyrmforge.profile.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("artifacts/ci-occlusion-shadow/run-local")
          report = json.loads((root / "player-occlusion-shadow.json").read_text())
          assert report["observedFrames"] == 11
          assert report["proposedBridgeFrames"] == 4
          assert report["humanReviewedBridgeFrames"] == 4
          assert report["bridgeNearVisibleHuman"] == 2
          assert report["bridgeFarFromVisibleHuman"] == 0
          assert report["bridgeOverAbsentHuman"] == 2
          assert report["bridgeUnknownHumanReference"] == 0
          assert report["unreviewedBridgeFrames"] == 0
