name: CI - free build and deterministic tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Argus.slnx
      - name: Build
        run: dotnet build Argus.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/Argus.Tests/Argus.Tests.csproj --configuration Release --no-build --logger trx
