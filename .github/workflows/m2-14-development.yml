name: M2.14 three new precommitted development sessions and blind review
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-development-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install free OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Build current ARGUS once
        run: |
          dotnet restore Argus.slnx
          dotnet build Argus.slnx --configuration Release --no-restore
      - name: Install Chromium
        shell: pwsh
        run: ./src/Argus.Runner/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Capture three new independent development-only external game sessions
        run: |
          mkdir -p artifacts/research-development
          for run in dev-f dev-g dev-h; do
            folder="artifacts/research-development/$run"
            started="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            exit_code=0
            echo "New independent browser session: $run"
            dotnet run --project src/Argus.Runner --configuration Release --no-build -- \
              --url https://pjotrcasteel.github.io/Wyrmforge/ \
              --agent visual --profile examples/wyrmforge.profile.json \
              --headless --width 390 --height 844 --max-steps 72 --timeout-seconds 190 \
              --output "$folder" || exit_code=$?
            export ARGUS_DEV_FOLDER="$folder"
            export ARGUS_DEV_STARTED="$started"
            export ARGUS_DEV_EXIT="$exit_code"
            python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ["ARGUS_DEV_FOLDER"])
          summary_path = folder / "summary.json"
          summary = json.loads(summary_path.read_text()) if summary_path.is_file() else None
          trace = folder / "trace.jsonl"
          profile = Path("examples/wyrmforge.profile.json")
          record = {
              "schemaVersion": 1,
              "partition": "development",
              "studyRole": "independent fresh development capture, NOT HELD-OUT",
              "startedAtUtc": os.environ["ARGUS_DEV_STARTED"],
              "finishedAtUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "runnerExitCode": int(os.environ["ARGUS_DEV_EXIT"]),
              "actualGameOutcome": "unknown",
              "gameVersion": None,
              "gameUrl": "https://pjotrcasteel.github.io/Wyrmforge/",
              "profileSha256": hashlib.sha256(profile.read_bytes()).hexdigest(),
              "traceSha256": hashlib.sha256(trace.read_bytes()).hexdigest() if trace.exists() else None,
              "policyVersion": os.environ["GITHUB_SHA"],
              "viewport": "390x844",
              "frames": summary.get("frames") if summary else None,
              "visualEvidenceGate": summary.get("meetsVisualCombatGate") if summary else None
          }
          folder.mkdir(parents=True, exist_ok=True)
          (folder / "run-manifest.json").write_text(json.dumps(record, indent=2) + "\n")
          print("Recorded development provenance:", json.dumps(record))
          PY
          done
      - name: Freeze image-only blind sample selection before any human review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/research-development")
          rows = [json.loads((root / run / "run-manifest.json").read_text()) for run in ("dev-f", "dev-g", "dev-h")]
          assert all(item["runnerExitCode"] == 0 and item["frames"] is not None and item["frames"] >= 24 for item in rows)
          assert all(item["traceSha256"] for item in rows)
          assert len(set(item["traceSha256"] for item in rows)) == 3
          assert all(item["partition"] == "development" and item["actualGameOutcome"] == "unknown" for item in rows)
          print("Three separate browser-process captures verified; no claim of matched procedural game state.")
          PY
          dotnet run --project src/Argus.Study.Tool --configuration Release --no-build -- \
            --runs artifacts/research-development \
            --seed argus-m214-blind-24-bins-development-only-20261018 --samples 24 --development-only
          dotnet run --project src/Argus.Study.Quality.Tool --configuration Release --no-build -- \
            --runs artifacts/research-development
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("artifacts/research-development")
          plan = json.loads((folder / "study-plan.json").read_text())
          quality = json.loads((folder / "study-quality.json").read_text())
          assert plan["mode"] == "development-only"
          assert sorted(a["runId"] for a in plan["assignments"]) == ["dev-f", "dev-g", "dev-h"]
          assert all(a["partition"] == "development" and len(a["frameSteps"]) == 24 for a in plan["assignments"])
          assert quality["status"] == "NOT_EVALUATED"
          assert quality["partitions"][1]["runs"] == 0
          for run in ("dev-f", "dev-g", "dev-h"):
              labels = json.loads((folder / run / "blind-labels.template.json").read_text())
              assert all(f["player"]["state"] == "unknown" and f["threats"]["state"] == "unknown"
                         for f in labels["frames"])
          print("72 presampled BLIND development screenshots; ZERO human labels fabricated.")
          PY
      - name: Assess frozen sample's ACTUAL shadow candidate coverage without choosing frames or labels
        run: |
          for run in dev-f dev-g dev-h; do
            folder="artifacts/research-development/$run"
            cp "$folder/blind-labels.template.json" "$folder/labels.json"
            dotnet run --project src/Argus.Evaluation.Tool --configuration Release --no-build -- \
              --run "$folder" --occlusion-shadow examples/wyrmforge.profile.json
            rm "$folder/labels.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/research-development")
          plan = json.loads((root / "study-plan.json").read_text())
          counts = []
          for item in plan["assignments"]:
              name = item["runId"]
              original = json.loads((root / name / "player-occlusion-shadow.json").read_text())
              preselected = set(item["frameSteps"])
              proposals = [frame["step"] for frame in original["frames"]
                           if frame["status"] in ("BRIDGE_ONE", "BRIDGE_TWO")]
              reviewed = sorted(preselected.intersection(proposals))
              counts.append({"runId":name,"totalRawBridgeCandidates":len(proposals),
                             "candidateStepsInFrozen24":reviewed,"candidateCountInFrozen24":len(reviewed),
                             "knownHumanLabels":0,
                             "learningReadiness":"NOT_EVALUATED"})
              print(name, "raw memory proposals in previously frozen selection", len(reviewed),
                    "(not all become human positives/negatives; no claim of learning readiness)")
          (root / "m214-candidate-coverage-preview.json").write_text(
              json.dumps({"schemaVersion":1,"samplingUnaffected":True,
                          "dataPartition":"development-only","runs":counts},indent=2) + "\n")
          assert all(row["knownHumanLabels"] == 0 for row in counts)
          PY
      - name: Build independent iPhone-friendly blind review artifact (no automatic publication)
        run: |
          python3 tools/m26b/mobile_review.py \
            --runs artifacts/research-development --output artifacts/m214-review-site
          python3 - <<'PY'
          from pathlib import Path
          for run in ("dev-f", "dev-g", "dev-h"):
              root = Path("artifacts/m214-review-site/annoteren") / run
              page = (root / "index.html").read_text()
              assert len(list(root.glob("frame-*.png"))) == 24
              assert "/*ARGUS_FRAMES*/" not in page and "/*ARGUS_LABELS*/" not in page
              assert "threatLocations" not in page and "playerX" not in page
              assert "24 echte screenshots" in page
              assert "run-01" not in page and "run-02" not in page
          print("Only 72 original sampled PNGs plus prediction-free mobile pages included.")
          PY
          python3 -m pip install --quiet --break-system-packages playwright
          python3 tools/m26b/smoke.py --site artifacts/m214-review-site --runs dev-f dev-g dev-h
      - name: Independently verify freeze and three distinct trace hashes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/research-development")
          selected = json.loads((root / "study-plan.json").read_text())
          assert selected["seed"] == "argus-m214-blind-24-bins-development-only-20261018"
          assert selected["mode"] == "development-only"
          assert sorted(x["runId"] for x in selected["assignments"]) == ["dev-f","dev-g","dev-h"]
          assert all(x["partition"] == "development" and len(x["frameSteps"]) == 24 for x in selected["assignments"])
          fingerprints = []
          for run in ("dev-f","dev-g","dev-h"):
              folder = root / run
              trace = (folder / "trace.jsonl").read_bytes()
              digest = hashlib.sha256(trace).hexdigest()
              manifest = json.loads((folder / "run-manifest.json").read_text())
              assert manifest["traceSha256"] == digest
              assert manifest["runnerExitCode"] == 0
              assert manifest["frames"] >= 24
              assert manifest["partition"] == "development"
              fingerprints.append(digest)
          assert len(set(fingerprints)) == 3
          print("VALIDATED: three disjoint trace files and 72 immutable blind image samples.")
          PY
      - name: Preserve development evidence and frozen reference plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-m214-independent-development-evidence
          path: artifacts/research-development/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve ready-to-host mobile review site separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-m214-mobile-blind-review
          path: artifacts/m214-review-site/
          retention-days: 7
          if-no-files-found: warn
