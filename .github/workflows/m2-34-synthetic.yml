name: M2.34 synthetic validation
on:
  pull_request:
    paths:
      - 'tools/m234/**'
      - 'tests/m234/**'
      - '.github/workflows/m2-34-synthetic.yml'
  push:
    branches: [main]
    paths:
      - 'tools/m234/**'
      - 'tests/m234/**'
      - '.github/workflows/m2-34-synthetic.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'Pillow>=11,<13'
      - run: python -m unittest discover -s tests/m234 -p 'test_*.py' -v
        env:
          PYTHONPATH: .
          OPENBLAS_NUM_THREADS: 1
